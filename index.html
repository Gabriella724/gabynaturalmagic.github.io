<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gaby Natural Magic</title>

<link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">

<style>

body{
margin:0;
font-family:'Poppins',sans-serif;
background:linear-gradient(135deg,#fff,#fdf6e3);
scroll-behavior:smooth;
}

/* NAVBAR */

.navbar{
position:fixed;
top:0;
width:100%;
display:flex;
justify-content:space-between;
padding:15px 30px;
background:rgba(255,255,255,0.95);
backdrop-filter:blur(10px);
box-shadow:0 5px 20px rgba(0,0,0,0.1);
z-index:1000;
}

.logo{
font-size:22px;
font-weight:bold;
background:linear-gradient(90deg,#FFD700,#fff5b7,#FFD700);
background-size:200%;
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 3s linear infinite;
}

@keyframes shine{
0%{background-position:0%}
100%{background-position:200%}
}

.navbar ul{
list-style:none;
display:flex;
gap:20px;
}

.navbar a{
text-decoration:none;
color:#333;
font-weight:600;
}

/* HERO */

.hero{
height:100vh;
background:url('https://images.unsplash.com/photo-1600948836101-f9ffda59d250?q=80') no-repeat center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
}

.hero-overlay{
background:rgba(0,0,0,0.5);
padding:60px;
border-radius:25px;
}

.hero h1{
font-size:3rem;
letter-spacing:3px;
}

.btn{
background:linear-gradient(45deg,#FFD700,#ffcc00);
color:white;
padding:14px 30px;
border-radius:30px;
text-decoration:none;
box-shadow:0 0 20px #FFD700;
transition:0.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 0 30px #ffcc00;
}

/* SECTIONS */

section{
padding:80px 20px;
text-align:center;
}

.section-title{
font-size:30px;
margin-bottom:30px;
color:#333;
}

/* GALERIA */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
}

.gallery img{
width:100%;
border-radius:20px;
transition:0.4s;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

.gallery img:hover{
transform:scale(1.08);
}

/* ACCORDION */

.accordion-btn{
background:linear-gradient(45deg,#FFD700,#ffcc00);
color:white;
padding:15px;
width:100%;
border:none;
border-radius:12px;
margin-top:10px;
font-size:18px;
cursor:pointer;
box-shadow:0 0 15px #FFD700;
}

.panel{
display:none;
padding:15px;
background:white;
border-radius:12px;
margin-bottom:10px;
box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

/* CHAT */

.chat-btn{
position:fixed;
bottom:20px;
right:20px;
background:linear-gradient(45deg,#FFD700,#ffcc00);
width:60px;
height:60px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:25px;
cursor:pointer;
box-shadow:0 0 20px #FFD700;
}

.chat-box{
display:none;
position:fixed;
bottom:90px;
right:20px;
width:300px;
background:white;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.2);
padding:20px;
}

/* FORM */

form input, form textarea{
width:100%;
padding:12px;
margin:10px 0;
border-radius:10px;
border:1px solid #ddd;
}

form button{
background:linear-gradient(45deg,#FFD700,#ffcc00);
color:white;
padding:12px;
border:none;
border-radius:25px;
width:100%;
box-shadow:0 0 15px #FFD700;
cursor:pointer;
}

/* RESPONSIVE */

@media(max-width:768px){
.hero h1{font-size:2rem;}
.navbar ul{display:none;}
}

</style>
</head>

<body>

<nav class="navbar">
<div class="logo">GABY NATURAL MAGIC</div>
<ul>
<li><a href="#servicios">Servicios</a></li>
<li><a href="#galeria">Galería</a></li>
<li><a href="#reservas">Reservas</a></li>
<li><a href="#ubicacion">Ubicación</a></li>
</ul>
</nav>

<header class="hero">
<div class="hero-overlay">
<h1>Transforma Tu Belleza</h1>
<a href="#reservas" class="btn">Reservar Ahora</a>
</div>
</header>

<section id="galeria" data-aos="fade-up">
<h2 class="section-title">Galería</h2>
<div class="gallery">
<img src="https://images.unsplash.com/photo-1580618672591-eb180b1a973f?q=80">
<img src="https://images.unsplash.com/photo-1596464716127-f2a82984de30?q=80">
<img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?q=80">
</div>
</section>

<section id="reservas">
<h2 class="section-title">Reservas</h2>

<div class="calendly-inline-widget"
data-url="https://calendly.com/gaby-natural-magic/transformacion-natural-vip-3-horas-clon"
style="min-width:320px;height:700px;">
</div>

<script src="https://assets.calendly.com/assets/external/widget.js" async></script>

<h3>Confirmar por correo</h3>

<form action="https://formspree.io/f/XXXXXXX" method="POST">
<input type="text" name="nombre" placeholder="Nombre completo" required>
<input type="email" name="email" placeholder="Correo electrónico" required>
<textarea name="mensaje" placeholder="Servicio reservado"></textarea>
<button type="submit">Confirmar Cita</button>
</form>

</section>

<section id="ubicacion">
<h2 class="section-title">Ubicación</h2>
<p>📍 Cra 6 #8-26 San Gil, Santander</p>
<iframe
src="https://www.google.com/maps?q=Cra+6+%238-26+San+Gil+Santander&output=embed"
width="100%"
height="400"
style="border:0;border-radius:20px;"
allowfullscreen=""
loading="lazy">
</iframe>
</section>

<div class="chat-btn" onclick="toggleChat()">💬</div>

<div class="chat-box" id="chatBox">
<p><strong>Asistente Gaby:</strong><br>
Hola hermosa 💖 ¿Qué servicio deseas agendar?</p>
</div>

<script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
<script>
AOS.init({duration:1200,once:true});

function toggleChat(){
var chat=document.getElementById("chatBox");
chat.style.display=chat.style.display==="block"?"none":"block";
}

var acc=document.getElementsByClassName("accordion-btn");
for(var i=0;i<acc.length;i++){
acc[i].addEventListener("click",function(){
var panel=this.nextElementSibling;
panel.style.display=panel.style.display==="block"?"none":"block";
});
}
</script>

</body>
</html>
